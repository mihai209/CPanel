name: Security - Axios Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'npm-shrinkwrap.json'
      - 'scripts/security-check-axios.js'
      - '.github/workflows/security-axios.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'npm-shrinkwrap.json'
      - 'scripts/security-check-axios.js'
      - '.github/workflows/security-axios.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run axios security guard
        run: node scripts/security-check-axios.js
