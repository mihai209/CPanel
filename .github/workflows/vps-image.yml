name: Build VPS Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'images/misc/cpanel-vps-image/**'
      - '.github/workflows/vps-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - tag: ubuntu
            base_image: ubuntu:24.04
          - tag: debian
            base_image: debian:12-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./images/misc/cpanel-vps-image
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          tags: |
            ghcr.io/mihai209/cpanel-vps:${{ matrix.tag }}
