name: Security - Supply Chain Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'npm-shrinkwrap.json'
      - 'security/supply-chain-blocklist.json'
      - 'scripts/security-check-supply-chain.js'
      - '.github/workflows/security-supply-chain.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'npm-shrinkwrap.json'
      - 'security/supply-chain-blocklist.json'
      - 'scripts/security-check-supply-chain.js'
      - '.github/workflows/security-supply-chain.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run supply-chain security guard
        run: node scripts/security-check-supply-chain.js
