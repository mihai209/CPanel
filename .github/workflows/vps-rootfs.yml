name: Build VPS Rootfs Archives

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish to
        required: true
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            release: "22.04"
            arch: amd64
          - distro: ubuntu
            release: "24.04"
            arch: amd64
          - distro: debian
            release: "12"
            arch: amd64
          - distro: debian
            release: "13"
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      - name: Build rootfs archive
        run: |
          chmod +x images/misc/cpanel-vps-rootfs/build-rootfs.sh
          images/misc/cpanel-vps-rootfs/build-rootfs.sh \
            "${{ matrix.distro }}" \
            "${{ matrix.release }}" \
            "${{ matrix.arch }}" \
            "${{ github.workspace }}/dist"

      # 🔴 Publish to DIFFERENT repo release
      - name: Publish release asset (external repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: RootFS ${{ github.event.inputs.release_tag }}
          files: dist/*.tar.xz
          repository: mihai209/cpanel-vps-rootfs
        env:
          GITHUB_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
