name: Build VPS Rootfs Archives

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish to
        required: true
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            release: "22.04"
            arch: amd64
          - distro: ubuntu
            release: "24.04"
            arch: amd64
          - distro: debian
            release: "12"
            arch: amd64
          - distro: debian
            release: "13"
            arch: amd64

    steps:
      - name: Checkout (source repo)
        uses: actions/checkout@v4

      - name: Install debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      - name: Build rootfs archive
        run: |
          chmod +x images/misc/cpanel-vps-rootfs/build-rootfs.sh
          images/misc/cpanel-vps-rootfs/build-rootfs.sh \
            "${{ matrix.distro }}" \
            "${{ matrix.release }}" \
            "${{ matrix.arch }}" \
            "${{ github.workspace }}/dist"

      # 🔴 Clone target repo
      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/mihai209/cpanel-vps-rootfs.git target-repo

      # 🔴 Copy artifacts
      - name: Copy artifacts
        run: |
          mkdir -p target-repo/releases/${{ github.event.inputs.release_tag }}
          cp dist/*.tar.xz target-repo/releases/${{ github.event.inputs.release_tag }}/

      # 🔴 Commit + push
      - name: Commit and push
        run: |
          cd target-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Add rootfs build for ${{ github.event.inputs.release_tag }} (${{ matrix.distro }} ${{ matrix.release }})" || echo "No changes"
          git push
